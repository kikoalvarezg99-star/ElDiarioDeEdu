name: Crear APK de Android

# Se ejecuta a mano: GitHub → pestaña Actions → "Crear APK de Android" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # La app Android abre la web publicada (GitHub Pages): cada vez que se
      # actualiza la web, la app se actualiza sola. Aquí solo hace falta una
      # página mínima porque Capacitor exige una carpeta de arranque.
      - name: Página mínima de arranque
        run: |
          mkdir -p out
          echo '<!doctype html><meta charset="utf-8"><title>Eduardo Rivero</title><p>Cargando…</p>' > out/index.html

      - name: Instalar Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - run: npx cap add android
      - name: Icono de la app (logo de Eduardo Rivero)
        run: |
          pip install --break-system-packages pillow || pip install pillow
          python3 scripts/android_icons.py android/app/src/main/res
      - run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EduardoRivero.apk
          gh release create "apk-${{ github.run_number }}" EduardoRivero.apk \
            --title "App Android (versión ${{ github.run_number }})" \
            --notes "APK para instalar en Android. Commit ${{ github.sha }}"
